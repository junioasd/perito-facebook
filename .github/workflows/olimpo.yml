name: Olimpo Autonomia Cloud

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'

jobs:
  executar-autonomia:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install python-dotenv requests python-telegram-bot

      - name: Executar Script de Autonomia
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -u autonomia_expediente.py

      - name: Enviar Relatório Final Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python modulo_1_infra/ares_telegram.py
