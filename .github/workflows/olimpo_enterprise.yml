name: Olimpo AI Enterprise Autonomous Engine

on:
  schedule:
    - cron: '*/30 * * * *' # Executa a cada 30 minutos em modo One-Shot
  workflow_dispatch:      # Permite disparo manual imediato pelo painel do GitHub

jobs:
  executar-ecossistema:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependências (PyYAML, etc.)
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml requests

      - name: Executar Ciclo Autónomo & Motores Zeus / Apolo
        env:
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          echo "[CI/CD] A iniciar ronda autónoma do Olimpo AI..."
          python autonomia_expediente.py

      - name: Sincronizar Relatórios e Status Page no Repositório
        run: |
          git config --global user.name "Olimpo AI Bot"
          git config --global user.email "bot@olimpo.ai"
          git add modulo_4_apolo/ modulo_3_atena/ modulo_2_hermes/ config.yaml
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(olimpo): atualização autónoma de telemetria e auditoria [skip ci]" && git push)
